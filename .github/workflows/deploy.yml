name: BRVIN Teachers CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "cloudflare.config.ts"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "cloudflare.config.ts"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brvin-teachers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build Worker
        run: npx cf build --mode production

      - name: Validate deployment package without deploying
        run: npx cf deploy --prebuilt --mode production --dry-run

  deploy:
    name: Deploy and smoke-test production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production Worker
        run: npx cf build --mode production

      - name: Deploy existing Worker resource
        run: npx cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify public health endpoint
        shell: bash
        env:
          HEALTH_URL: https://brvin-teachers.thenewtongs.workers.dev/health
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$HEALTH_URL" -o health.json; then
              cat health.json
              node --input-type=module -e '
                import fs from "node:fs";
                const body = JSON.parse(fs.readFileSync("health.json", "utf8"));
                if (body.ok !== true || body.app !== "brvin-teachers" || body.status !== "bootstrap") {
                  throw new Error("Unexpected health response");
                }
                console.log("Production health check passed.");
              '
              exit 0
            fi
            echo "Health endpoint not ready (attempt $attempt/12); retrying..."
            sleep 5
          done
          echo "Production health endpoint failed after retries."
          exit 1
