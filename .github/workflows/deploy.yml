name: BRVIN Teachers CI/CD
on:
  push:
    branches: [main]
    paths: ["src/**","migrations/**","test/**","cloudflare.config.ts","vite.config.ts","tsconfig.json","package.json","package-lock.json",".github/workflows/deploy.yml"]
  pull_request:
    branches: [main]
    paths: ["src/**","migrations/**","test/**","cloudflare.config.ts","vite.config.ts","tsconfig.json","package.json","package-lock.json",".github/workflows/deploy.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brvin-teachers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22.23.0", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx cf build --mode production
      - run: npx cf deploy --prebuilt --mode production --dry-run
  deploy:
    name: Migrate, deploy and smoke-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22.23.0", cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Apply application D1 migrations
        run: npx cf d1 migrations apply e1d4c754-7b89-45d0-9ee0-e8c0049a5ebf --dir migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx cf build --mode production
      - name: Deploy existing Worker resource
        run: npx cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify public health endpoint
        shell: bash
        env:
          HEALTH_URL: https://brvin-teachers.thenewtongs.workers.dev/health
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$HEALTH_URL" -o health.json; then
              node --input-type=module -e '
                import fs from "node:fs";
                const body = JSON.parse(fs.readFileSync("health.json", "utf8"));
                if (body.ok !== true || body.app !== "brvin-teachers" || body.status !== "operator-console") throw new Error("Unexpected health response");
                console.log("Production health check passed.");
              '
              exit 0
            fi
            echo "Health endpoint not ready (attempt $attempt/12); retrying..."
            sleep 5
          done
          echo "Health endpoint failed."
          exit 1
      - name: Verify Access protects operator route
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://brvin-teachers.thenewtongs.workers.dev/operator)"
          if [[ "$status" != "302" && "$status" != "403" ]]; then echo "Expected Access protection; received HTTP $status"; exit 1; fi
          echo "Operator route is protected."
