name: Generate dependency lockfile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate and commit package-lock.json
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.0"

      - name: Generate deterministic dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git commit -m "chore: add deterministic npm lockfile"
          git push
